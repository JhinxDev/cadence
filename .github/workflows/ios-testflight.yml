name: TestFlight iOS Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Distribution mode
        type: choice
        default: upload
        options:
          - upload
          - export-only
      build_number:
        description: Optional CFBundleVersion override
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cadence-testflight
  cancel-in-progress: false

jobs:
  testflight-ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.3.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
      - name: Ensure XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Validate App Store Connect secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
      - name: Archive and upload Cadence to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          CADENCE_DEFAULT_SERVER_URL: ${{ secrets.CADENCE_DEFAULT_SERVER_URL }}
          TF_MODE: ${{ inputs.mode }}
          TF_BUILD: ${{ inputs.build_number }}
        run: |
          args=(--output "$RUNNER_TEMP/cadence-testflight")
          if [ "$TF_MODE" = "export-only" ]; then
            args+=(--export-only)
          fi
          if [ -n "$TF_BUILD" ]; then
            args+=(--build-number "$TF_BUILD")
          fi
          bash scripts/deploy-testflight-ios.sh "${args[@]}"
      - name: Upload TestFlight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-testflight-${{ github.sha }}
          path: ${{ runner.temp }}/cadence-testflight/
          retention-days: 7
